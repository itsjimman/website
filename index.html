<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSJIMMAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f7f5;
  --black: #0a0a0a;
  --g1: #555555;
  --g2: #999999;
  --g3: #dedbd6;
  --gold: #b8965a;
}

html, body {
  background: var(--bg);
  color: var(--black);
  font-family: 'Barlow', sans-serif;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body { cursor: none; }
#cur  { position:fixed; width:6px; height:6px; background:var(--black); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .15s, height .15s, opacity .2s; }
#curR { position:fixed; width:34px; height:34px; border:1px solid rgba(0,0,0,.12); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:width .35s cubic-bezier(.23,1,.32,1), height .35s cubic-bezier(.23,1,.32,1), border-color .3s; }
body.hov #cur  { width:5px; height:5px; opacity:.4; }
body.hov #curR { width:52px; height:52px; border-color:rgba(184,150,90,.45); }

/* Loader */
#loader {
  position:fixed; inset:0; background:var(--bg);
  z-index:2000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:28px;
  transition:opacity 1.2s ease, visibility 1.2s ease;
}
#loader.out { opacity:0; visibility:hidden; pointer-events:none; }
.ld-logo {
  width:96px; height:96px; object-fit:contain;
  opacity:0; animation:fadeIn .6s .2s ease forwards;
}
.ld-brand {
  font-family:'Barlow', sans-serif;
  font-weight:300; font-size:13px; letter-spacing:12px;
  text-transform:uppercase; color:var(--black);
  opacity:0; animation:fadeIn .6s .5s ease forwards;
}
.ld-track { width:64px; height:1px; background:var(--g3); overflow:hidden; }
.ld-fill  { height:100%; background:var(--black); width:0; animation:fillBar 1.8s .7s cubic-bezier(.4,0,.2,1) forwards; }

@keyframes fadeIn { to { opacity:1; } }
@keyframes fillBar { to { width:100%; } }

/* Layout */
#site {
  height:100vh; width:100%;
  display:flex; flex-direction:column;
  justify-content:space-between;
  padding:44px 56px;
}

/* Header */
.row-top {
  display:flex; justify-content:space-between; align-items:center;
  opacity:0; animation:slideUp .8s .9s ease forwards;
}
.brand { display:flex; align-items:center; gap:14px; }
.brand-logo { width:44px; height:44px; object-fit:contain; }
.brand-text { display:flex; flex-direction:column; gap:3px; }
.brand-main {
  font-family:'Barlow', sans-serif;
  font-weight:300; font-size:13px; letter-spacing:5px;
  text-transform:uppercase; color:var(--black); line-height:1;
}
.brand-sub {
  font-size:11px; font-weight:300; letter-spacing:3px;
  text-transform:uppercase; color:var(--g2);
}
.location {
  font-size:12px; font-weight:300; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--g2);
}

/* Center */
.row-mid {
  display:flex; flex-direction:column;
  align-items:center; text-align:center;
}
.wip-eyebrow {
  font-size:12px; font-weight:500; letter-spacing:6px;
  text-transform:uppercase; color:var(--g1);
  margin-bottom:22px;
  opacity:0; animation:slideUp .8s 1.1s ease forwards;
}
.wip-title {
  font-family: Impact, 'Arial Narrow', sans-serif;
  font-size:clamp(72px, 11vw, 148px);
  line-height:.88; letter-spacing:.01em;
  text-transform:uppercase; color:var(--black);
  opacity:0; animation:slideUp .9s 1.2s ease forwards;
}
.wip-title .outline {
  color:transparent;
  -webkit-text-stroke:2px rgba(0,0,0,.15);
}
.divider {
  width:1px; height:48px;
  background:linear-gradient(to bottom, transparent, var(--gold), transparent);
  margin:28px auto;
  opacity:0; animation:fadeIn .8s 1.5s ease forwards;
}
.wip-cta {
  margin-top:36px;
  display:flex; align-items:center; gap:24px;
  opacity:0; animation:slideUp .8s 1.6s ease forwards;
}
.btn-contact {
  display:inline-flex; align-items:center; gap:10px;
  font-family:'Barlow', sans-serif;
  font-size:12px; font-weight:500; letter-spacing:4px;
  text-transform:uppercase; color:var(--black);
  background:none; border:none; cursor:none;
  padding:0; transition:color .3s;
}
.btn-contact:hover { color:var(--gold); }
.btn-contact-line {
  width:28px; height:1px; background:var(--gold);
  transition:width .4s cubic-bezier(.23,1,.32,1);
}
.btn-contact:hover .btn-contact-line { width:42px; }
.wip-sep { font-size:14px; color:var(--g3); font-weight:300; }
.wip-insta {
  font-size:12px; font-weight:400; letter-spacing:3px;
  text-transform:uppercase; color:var(--g2);
  text-decoration:none; transition:color .3s;
}
.wip-insta:hover { color:var(--black); }

/* Footer */
.row-bot {
  display:flex; justify-content:space-between; align-items:flex-end;
  opacity:0; animation:slideUp .8s 1.8s ease forwards;
}
.copy {
  font-size:11px; font-weight:300; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--g2);
}
.status-pill {
  display:flex; align-items:center; gap:10px;
  font-size:11px; font-weight:400; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--g1);
}
.status-dot {
  width:6px; height:6px; background:var(--gold);
  border-radius:50%; animation:blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

.corner {
  position:fixed; width:20px; height:20px;
  z-index:2; opacity:0; animation:fadeIn .6s 2s ease forwards;
}
.corner--tl { top:24px; left:24px; border-top:1px solid var(--g3); border-left:1px solid var(--g3); }
.corner--tr { top:24px; right:24px; border-top:1px solid var(--g3); border-right:1px solid var(--g3); }
.corner--bl { bottom:24px; left:24px; border-bottom:1px solid var(--g3); border-left:1px solid var(--g3); }
.corner--br { bottom:24px; right:24px; border-bottom:1px solid var(--g3); border-right:1px solid var(--g3); }

@keyframes slideUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Drawer */
#drawer-overlay {
  position:fixed; inset:0;
  background:rgba(248,247,245,.8);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  z-index:500; opacity:0; visibility:hidden;
  transition:opacity .5s ease, visibility .5s ease;
}
#drawer-overlay.open { opacity:1; visibility:visible; }

#drawer {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--bg); border-top:1px solid var(--g3);
  padding:52px 56px 56px;
  z-index:600; transform:translateY(100%);
  transition:transform .6s cubic-bezier(.23,1,.32,1);
  max-height:90vh; overflow-y:auto;
}
#drawer.open { transform:translateY(0); }

.drawer-head {
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:44px;
}
.drawer-title {
  font-family: Impact, 'Arial Narrow', sans-serif;
  font-size:clamp(36px, 5vw, 64px);
  text-transform:uppercase; color:var(--black);
  line-height:.9; letter-spacing:.01em;
}
.drawer-sub {
  font-size:13px; font-weight:300; letter-spacing:3px;
  text-transform:uppercase; color:var(--g1); margin-top:12px;
}
.drawer-close {
  background:none; border:none; cursor:none;
  font-family:'Barlow', sans-serif;
  font-size:12px; font-weight:500; letter-spacing:3px;
  text-transform:uppercase; color:var(--g1);
  padding:0; transition:color .3s;
  display:flex; align-items:center; gap:10px;
}
.drawer-close:hover { color:var(--black); }
.drawer-close-x { width:18px; height:18px; position:relative; }
.drawer-close-x::before, .drawer-close-x::after {
  content:''; position:absolute; width:100%; height:1px;
  background:currentColor; top:50%; left:0;
}
.drawer-close-x::before { transform:rotate(45deg); }
.drawer-close-x::after  { transform:rotate(-45deg); }

#contact-form {
  display:grid; grid-template-columns:1fr 1fr;
  gap:28px 36px; max-width:760px;
}
.form-group { display:flex; flex-direction:column; gap:10px; }
.form-group.full { grid-column:1 / -1; }
.form-label {
  font-size:11px; font-weight:500; letter-spacing:3.5px;
  text-transform:uppercase; color:var(--g1);
}
.form-input, .form-textarea {
  background:transparent; border:none;
  border-bottom:1px solid var(--g3);
  color:var(--black); font-family:'Barlow', sans-serif;
  font-size:15px; font-weight:300;
  padding:10px 0; outline:none; width:100%;
  transition:border-color .3s; cursor:text;
}
.form-input::placeholder, .form-textarea::placeholder { color:var(--g3); }
.form-input:focus, .form-textarea:focus { border-color:var(--gold); }
.form-textarea { resize:none; height:80px; }

.form-footer {
  grid-column:1 / -1;
  display:flex; justify-content:space-between;
  align-items:center; margin-top:8px;
}
.form-note {
  font-size:12px; font-weight:300; letter-spacing:2px;
  text-transform:uppercase; color:var(--g2);
}
.btn-send {
  display:inline-flex; align-items:center; gap:12px;
  background:none; border:none; cursor:none;
  font-family:'Barlow', sans-serif;
  font-size:12px; font-weight:500; letter-spacing:4px;
  text-transform:uppercase; color:var(--black);
  padding:0; transition:color .3s;
}
.btn-send:hover { color:var(--gold); }
.btn-send-arrow {
  width:32px; height:1px; background:currentColor;
  position:relative; transition:width .4s cubic-bezier(.23,1,.32,1);
}
.btn-send-arrow::after {
  content:''; position:absolute; right:0; top:-3px;
  width:6px; height:6px;
  border-top:1px solid currentColor;
  border-right:1px solid currentColor;
  transform:rotate(45deg);
}
.btn-send:hover .btn-send-arrow { width:46px; }
.btn-send:disabled { opacity:.4; }

#form-success { display:none; text-align:center; padding:56px 0; }
#form-success.show { display:block; }
.success-icon {
  font-family: Impact, 'Arial Narrow', sans-serif;
  font-size:56px; color:var(--gold); margin-bottom:16px;
}
.success-msg {
  font-size:13px; font-weight:400; letter-spacing:4px;
  text-transform:uppercase; color:var(--g1);
}

@media (max-width:600px) {
  #site { padding:32px 24px; }
  #drawer { padding:36px 24px 48px; }
  #contact-form { grid-template-columns:1fr; }
  .form-group.full { grid-column:1; }
  .wip-title { font-size:clamp(60px, 18vw, 110px); }
  .row-top .location { display:none; }
  .drawer-head { flex-direction:column; gap:24px; }
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="curR"></div>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div id="loader">
  <img class="ld-logo" src="itsjimman_logo.png" alt="ITSJIMMAN">
  <div class="ld-brand">ITSJIMMAN</div>
  <div class="ld-track"><div class="ld-fill"></div></div>
</div>

<div id="site">
  <div class="row-top">
    <div class="brand">
      <img class="brand-logo" src="itsjimman_logo.png" alt="IJ">
      <div class="brand-text">
        <div class="brand-main">ITSJIMMAN</div>
        <div class="brand-sub">Production</div>
      </div>
    </div>
    <div class="location">Bali, Indonesia</div>
  </div>

  <div class="row-mid">
    <div class="wip-eyebrow">Something is coming</div>
    <div class="wip-title">
      WORK IN<br><span class="outline">PROGRESS</span>
    </div>
    <div class="divider"></div>
    <div class="wip-cta">
      <button class="btn-contact" id="open-form">
        <span class="btn-contact-line"></span>
        Get in touch
      </button>
      <span class="wip-sep">·</span>
      <a href="https://instagram.com/itsjimman" target="_blank" class="wip-insta">@itsjimman</a>
    </div>
  </div>

  <div class="row-bot">
    <div class="copy">© 2026 ITSJIMMAN</div>
    <div class="status-pill">
      <div class="status-dot"></div>
      In development
    </div>
  </div>
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">LET'S WORK<br>TOGETHER</div>
      <div class="drawer-sub">enquiry@itsjimman.com</div>
    </div>
    <button class="drawer-close" id="close-form">
      <div class="drawer-close-x"></div>
      Close
    </button>
  </div>

  <form id="contact-form" action="https://formspree.io/f/meepbybl" method="POST">
    <input type="hidden" name="_subject" value="New enquiry — ITSJIMMAN">

    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" type="text" name="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" name="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Brand / Client</label>
      <input class="form-input" type="text" name="brand" placeholder="Brand name">
    </div>
    <div class="form-group">
      <label class="form-label">Project type</label>
      <input class="form-input" type="text" name="project_type" placeholder="Photography / Full production / etc.">
    </div>
    <div class="form-group full">
      <label class="form-label">Message</label>
      <textarea class="form-textarea" name="message" placeholder="Tell us about your project" required></textarea>
    </div>
    <div class="form-footer">
      <div class="form-note">We reply within 24 hours</div>
      <button class="btn-send" type="submit" id="btn-send">
        Send message
        <span class="btn-send-arrow"></span>
      </button>
    </div>
  </form>

  <div id="form-success">
    <div class="success-icon">✓</div>
    <div class="success-msg">Message sent — we'll be in touch soon</div>
  </div>
</div>

<script>
/* Loader — time based, no dependency on fonts/images */
setTimeout(() => document.getElementById('loader').classList.add('out'), 2400);

/* Cursor */
const cur = document.getElementById('cur');
const curR = document.getElementById('curR');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px';
  cur.style.top  = my + 'px';
});
(function loop() {
  rx += (mx - rx) * .1;
  ry += (my - ry) * .1;
  curR.style.left = rx + 'px';
  curR.style.top  = ry + 'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('hov'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('hov'));
});

/* Drawer */
const overlay  = document.getElementById('drawer-overlay');
const drawer   = document.getElementById('drawer');
const openBtn  = document.getElementById('open-form');
const closeBtn = document.getElementById('close-form');

function openDrawer()  {
  overlay.classList.add('open');
  drawer.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  document.body.style.overflow = '';
}

openBtn.addEventListener('click', openDrawer);
closeBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* Form submit via Formspree AJAX */
const form    = document.getElementById('contact-form');
const success = document.getElementById('form-success');
const sendBtn = document.getElementById('btn-send');

form.addEventListener('submit', async e => {
  e.preventDefault();
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';

  try {
    const res = await fetch('https://formspree.io/f/meepbybl', {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });

    if (res.ok) {
      form.style.display = 'none';
      success.classList.add('show');
      setTimeout(() => {
        closeDrawer();
        setTimeout(() => {
          form.style.display = 'grid';
          success.classList.remove('show');
          form.reset();
          sendBtn.disabled = false;
          sendBtn.innerHTML = 'Send message <span class="btn-send-arrow"></span>';
        }, 600);
      }, 2800);
    } else {
      sendBtn.disabled = false;
      sendBtn.innerHTML = 'Try again <span class="btn-send-arrow"></span>';
    }
  } catch(err) {
    sendBtn.disabled = false;
    sendBtn.innerHTML = 'Try again <span class="btn-send-arrow"></span>';
  }
});
</script>
</body>
</html>
